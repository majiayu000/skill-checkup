[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-checkup"
version = "0.1.1"
description = "Read-only health report for the agent skills on your machine: broken, competing, silent, heavy and unused skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
skill-checkup = "skill_checkup.__main__:main"

[tool.setuptools]
packages = ["skill_checkup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
