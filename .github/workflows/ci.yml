name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: CLI runs on an empty home
        run: HOME="$(mktemp -d)" python -m skill_checkup --out - > /dev/null
      - name: Demo machine produces every section
        run: |
          python examples/demo/build_demo.py "$RUNNER_TEMP/demo"
          HOME="$RUNNER_TEMP/demo" python -m skill_checkup --since 36500 --out "$RUNNER_TEMP/demo.md"
          grep -q "Copies have diverged" "$RUNNER_TEMP/demo.md"
          grep -q "already handled in the body of \`pr-queue\`" "$RUNNER_TEMP/demo.md"
          grep -q "Remove the Claude Code copy of \`commit-style\`" "$RUNNER_TEMP/demo.md"
